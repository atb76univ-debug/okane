<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>やりくり家計簿</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--sub:#6b7785;--ac:#2f8f6b;--bad:#d64545;--bd:#e1e6ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181d;--card:#1d252c;--tx:#e8edf1;--sub:#93a0ad;--ac:#4cc296;--bad:#ff7b7b;--bd:#2e3943;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13181d;--card:#1d252c;--tx:#e8edf1;--sub:#93a0ad;--ac:#4cc296;--bad:#ff7b7b;--bd:#2e3943;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
#sync{font-size:12px;color:var(--sub);font-weight:400}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.hero{text-align:center}
.big{font-size:44px;font-weight:700;color:var(--ac);line-height:1.2}
.big.neg{color:var(--bad)}
.note{font-size:12px;color:var(--sub)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--ac)}
form{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
input,select,button{font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
input{flex:1 1 100px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.x{background:none;color:var(--sub);padding:2px 8px;font-size:16px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.set input{flex:0 0 120px;text-align:right}
.save{color:var(--ac)}
</style>
</head>
<body>
<main>
<h1>やりくり家計簿 <span id="sync">読み込み中…</span></h1>

<div class="card hero">
  <div class="note" id="dateLbl"></div>
  <div class="note">今日の食費、あと使える額</div>
  <div class="big" id="todayLeft">-</div>
  <div class="note" id="dailyInfo"></div>
</div>

<div class="card">
  <h2>支出を記録</h2>
  <form id="expForm">
    <input id="eAmt" type="number" inputmode="numeric" placeholder="金額" required>
    <select id="eCat"><option value="food">食費</option><option value="other">その他</option></select>
    <input id="eMemo" placeholder="メモ（任意）">
    <button>追加</button>
  </form>
  <div id="expList" style="margin-top:8px"></div>
</div>

<div class="card">
  <h2>今月のまとめ</h2>
  <div class="row"><span>食費（使った / 予算）</span><b id="foodLbl"></b></div>
  <div class="bar"><i id="foodBar"></i></div>
  <div class="row"><span>収入（仕送り＋バイト）</span><b id="inc"></b></div>
  <div class="row"><span>サブスク合計</span><b id="subT"></b></div>
  <div class="row"><span>その他の支出</span><b id="otherT"></b></div>
  <div class="row"><span>今月の残り（全体）</span><b id="remain"></b></div>
  <div class="row"><span>貯金（先月までの繰り越し）</span><b id="save" class="save"></b></div>
</div>

<div class="card">
  <h2>サブスク（毎月）</h2>
  <div id="subList"></div>
  <form id="subForm">
    <input id="sName" placeholder="サービス名" required>
    <input id="sAmt" type="number" inputmode="numeric" placeholder="月額" required>
    <button>登録</button>
  </form>
</div>

<div class="card set">
  <h2>設定</h2>
  <label>仕送り<input id="sAllow" type="number" inputmode="numeric"></label>
  <label>バイト代<input id="sBaito" type="number" inputmode="numeric"></label>
  <label>食費の月予算<input id="sFood" type="number" inputmode="numeric"></label>
  <p class="note">毎月の余りは自動で貯金に繰り越されます。サブスク・食費以外の支出はバイト代側からやりくりする想定です。</p>
</div>
</main>

<script>
const KEY='okozukai-v1';
let S={allow:40000,baito:50000,food:40000,start:ym(new Date()),subs:[],exp:[],updated:0};
let ref=null,ready=false;
const $=id=>document.getElementById(id);
const yen=n=>(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const sum=a=>a.reduce((x,y)=>x+y,0);
const subTotal=()=>sum(S.subs.map(s=>s.amt));

function calc(){
  const now=new Date(),t=ymd(now),m=ym(now);
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const left=dim-now.getDate()+1;
  const me=S.exp.filter(e=>e.date.startsWith(m));
  const food=me.filter(e=>e.cat==='food');
  const foodAll=sum(food.map(e=>e.amt));
  const foodBefore=sum(food.filter(e=>e.date<t).map(e=>e.amt));
  const foodToday=sum(food.filter(e=>e.date===t).map(e=>e.amt));
  const daily=(S.food-foodBefore)/left;
  const other=sum(me.filter(e=>e.cat!=='food').map(e=>e.amt));
  const income=S.allow+S.baito;
  // 貯金：開始月〜先月の余りを合算
  let saving=0;
  const [sy,sm]=S.start.split('-').map(Number);
  for(let k=sy*12+sm-1;k<now.getFullYear()*12+now.getMonth();k++){
    const key=Math.floor(k/12)+'-'+pad(k%12+1);
    saving+=income-subTotal()-sum(S.exp.filter(e=>e.date.startsWith(key)).map(e=>e.amt));
  }
  return {t,dim,left,me,foodAll,foodToday,daily,other,income,saving,todayLeft:Math.floor(daily)-foodToday,m};
}

function render(){
  const c=calc(),now=new Date();
  $('dateLbl').textContent=`${now.getMonth()+1}月${now.getDate()}日（残り${c.left}日）`;
  const tl=$('todayLeft');tl.textContent=yen(c.todayLeft);tl.classList.toggle('neg',c.todayLeft<0);
  $('dailyInfo').textContent=`今日の食費枠 ${yen(Math.floor(c.daily))}（基本 ${yen(S.food/c.dim)}／日）・今日使った ${yen(c.foodToday)}`;
  $('foodLbl').textContent=`${yen(c.foodAll)} / ${yen(S.food)}`;
  $('foodBar').style.width=Math.min(100,Math.max(0,c.foodAll/S.food*100||0))+'%';
  $('inc').textContent=yen(c.income);
  $('subT').textContent=yen(subTotal());
  $('otherT').textContent=yen(c.other);
  const rem=c.income-subTotal()-c.foodAll-c.other;
  $('remain').textContent=yen(rem);$('remain').style.color=rem<0?'var(--bad)':'';
  $('save').textContent=yen(c.saving);
  $('expList').innerHTML=c.me.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,30).map(e=>
    `<div class="row"><span>${e.date.slice(5).replace('-','/')} ${e.cat==='food'?'食費':'その他'} ${esc(e.memo||'')}</span><span>${yen(e.amt)} <button class="x" data-e="${e.id}">×</button></span></div>`).join('')||'<p class="note">まだ記録がありません</p>';
  $('subList').innerHTML=S.subs.map((s,i)=>
    `<div class="row"><span>${esc(s.name)}</span><span>${yen(s.amt)} <button class="x" data-s="${i}">×</button></span></div>`).join('')||'<p class="note">未登録</p>';
}
function fillSettings(){
  for(const [id,k] of [['sAllow','allow'],['sBaito','baito'],['sFood','food']])
    if(document.activeElement!==$(id))$(id).value=S[k];
}

function setSync(t){$('sync').textContent=t}
let pushT=null;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(pushT);pushT=setTimeout(push,1500);
}
function change(){S.updated=Date.now();render();persist()}
function apply(o){
  if(!o||typeof o!=='object')return;
  S=Object.assign({allow:40000,baito:50000,food:40000,start:ym(new Date()),subs:[],exp:[],updated:0},o);
  render();fillSettings();
}

$('expForm').onsubmit=e=>{e.preventDefault();
  const amt=Number($('eAmt').value);if(!amt)return;
  S.exp.push({id:Date.now(),date:ymd(new Date()),amt,cat:$('eCat').value,memo:$('eMemo').value.trim()});
  $('eAmt').value='';$('eMemo').value='';change()};
$('subForm').onsubmit=e=>{e.preventDefault();
  S.subs.push({name:$('sName').value.trim(),amt:Number($('sAmt').value)||0});
  $('sName').value='';$('sAmt').value='';change()};
document.addEventListener('click',e=>{
  const d=e.target.dataset;
  if(d.e){S.exp=S.exp.filter(x=>String(x.id)!==d.e);change()}
  if(d.s){S.subs.splice(Number(d.s),1);change()}
});
for(const [id,k] of [['sAllow','allow'],['sBaito','baito'],['sFood','food']])
  $(id).oninput=()=>{S[k]=Number($(id).value)||0;change()};

// 先にローカルのデータで表示
try{const l=localStorage.getItem(KEY);if(l)apply(JSON.parse(l))}catch(e){}
render();fillSettings();setSync('接続中…');

// ===== 共有同期（このURLを開いた人は全員同じデータ） =====
let busy=false;
async function push(){
  if(busy)return;busy=true;
  try{
    const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});
    if(!r.ok)throw 0;
    const cur=await r.json();
    if(cur&&(cur.updated||0)>(S.updated||0)){apply(cur);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    setSync('☁ 同期済み');
  }catch(e){setSync('オフライン（この端末には保存済み）')}
  busy=false;
}
async function pull(){
  if(busy)return;
  try{
    const r=await fetch('/api/state',{cache:'no-store'});
    if(!r.ok)throw 0;
    const remote=await r.json();
    if(remote&&(remote.updated||0)>(S.updated||0)){apply(remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setSync('☁ 同期済み')}
    else if(!remote||(remote.updated||0)<(S.updated||0))await push();
    else setSync('☁ 同期済み');
  }catch(e){setSync('オフライン（この端末には保存済み）')}
}
pull();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
setInterval(()=>{if(!document.hidden)pull()},10000);
</script>
</body>
</html>
